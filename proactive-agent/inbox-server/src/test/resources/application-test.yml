spring:
  datasource:
    url: ${INBOX_TEST_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/inbox_test}
    username: ${INBOX_TEST_DB_USER:inbox}
    password: ${INBOX_TEST_DB_PASSWORD:inbox}
    hikari:
      maximum-pool-size: 40
  flyway:
    clean-disabled: false

inbox:
  # Deterministic tests drive the background loops by hand, one tick at a time.
  scheduling:
    enabled: false
  auth:
    clients:
      - id: acme-bot
        secret: acme-secret
        tenant: acme
        roles: PRODUCER
      - id: acme-bot-2
        secret: acme-secret-2
        tenant: acme
        roles: PRODUCER
      - id: globex-bot
        secret: globex-secret
        tenant: globex
        roles: PRODUCER
      - id: runtime-1
        secret: runtime-secret
        roles: RUNTIME
      # an agent runtime that also writes its own follow-ups (producer "agent_self")
      - id: agent-runtime
        secret: agent-secret
        roles: RUNTIME, PRODUCER
      - id: ops
        secret: ops-secret
        roles: OPERATOR
