openapi: 3.0.3
info:
  title: Agent API
  version: 0.1.0
  description: |
    The Agent API opens a proactive agent to applications. An application sends its users' messages
    and its own business events; the agent answers, and can also speak first.

    Conventions:

    - Field names are `snake_case`. A field without a value is left out, not sent as `null`.
    - An unknown field in a request is an error (400).
    - Timestamps are ISO-8601 in UTC.
    - Errors are `application/problem+json` with a stable, machine-readable `code`.

    Every `/v1` request carries a credential as `Authorization: Bearer <credential>`. There are three
    kinds. An **API key** (`afk.…`) identifies an application's back end. A **user token** (`aft.…`) is
    issued by that back end for one of its users, expires within the hour, and lets the user's own
    client call the API for that user only. An **administration key** opens `/v1/admin` and nothing
    else.
servers:
  - url: http://localhost:8090
    description: Local development
tags:
  - name: Service
    description: About the caller and the service.
  - name: Agents
    description: The agents of an application. What each one is for, which model it runs on, what it may use.
  - name: Credentials
    description: |
      The credentials of the MCP servers that agents use. They go straight to vaults on the agent
      platform, which adds them to the agent's calls of the server; this service does not keep them
      and cannot show them, and neither the agent nor its sandbox ever sees them.
  - name: Conversations
    description: What a user and the agent say to each other.
  - name: Events
    description: What the application's own systems tell the agent about a user, so that the agent can speak first.
  - name: Actions
    description: What the agent waits for people to decide. Approvals of tool calls, and questions to the user.
  - name: Schedules
    description: What the agent is to do at a given time, once or again and again.
  - name: Tasks
    description: |
      The work a user's main agent has handed to workers. A main agent is an agent with a
      `coordinator` block: everything about a user reaches its one session, and it delegates what
      takes long to other agents, each working in a session of its own and reporting back to it.

      What the user asks the main agent for starts at once. What the main agent begins on its own
      initiative waits for the user's confirmation, as a task with the status `proposed`, unless
      the application lets the role start unasked (`start` of the worker) or the user has given a
      standing authorisation for the role (a grant).
  - name: Updates
    description: |
      What happened for a user: a message, an action that waits or was decided, a task that a main
      agent delegated or that moved on, a run that failed. As a page to poll, as a live stream, or
      delivered to the application's webhook.
  - name: Users
    description: The end users of an application, and the tokens their clients use.
  - name: Admin
    description: Operator tools, for the people who run the service.
security:
  - Bearer: []

paths:
  /v1/whoami:
    get:
      tags: [Service]
      operationId: whoami
      summary: Check a credential
      description: Says who the service takes the caller for. Any valid credential may call it.
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Whoami'
              example:
                kind: user
                app_id: acme
                user_id: u42
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List agents
      description: Lists the application's agents, by key. Only an API key may call this.
      responses:
        '200':
          description: The agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentProfileView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/agents/{agent_key}:
    parameters:
      - name: agent_key
        in: path
        required: true
        description: The application's name for the agent, for example `default` or `support`.
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
    put:
      tags: [Agents]
      operationId: saveAgent
      summary: Create or replace an agent
      description: |
        Sets what the agent is: its instructions, its model, and what it may use. The body replaces
        the whole configuration; a field that is absent goes back to its default. Sending the same
        configuration again changes nothing.

        The agent is set up on the agent platform before this call returns. If the platform refuses
        the configuration (an unknown model, for instance) the answer is a 400 and nothing is saved;
        if the platform cannot be reached it is a 503 and nothing is saved either.

        Conversations that are under way pick up a new configuration at their next turn. Only an API
        key may call this.

        With a `coordinator` block the agent is a main agent. The agents it names as workers have to
        exist already and cannot be main agents themselves; an agent that is some main agent's
        worker cannot become a main agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProfileRequest'
            examples:
              agent:
                summary: An agent
                value:
                  name: Acme Support Assistant
                  instructions: You help Acme's customers with their orders. Be brief and concrete.
                  effort: medium
                  mcp_servers:
                    - name: orders
                      url: https://mcp.acme.example/orders
                      approval: always_ask
                      approver: user
              main_agent:
                summary: A main agent with one worker
                value:
                  name: Acme Assistant
                  instructions: You look after Acme's customers. Hand research that takes long to your researcher.
                  coordinator:
                    workers:
                      - role: researcher
                        agent: research
                        description: Looks things up in the order system and the carriers' sites, and reports what it found.
                        start: ask
                    max_active_tasks: 4
      responses:
        '200':
          description: The agent existed; this is its configuration now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileView'
        '201':
          description: The agent was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Read an agent
      description: Returns the agent's configuration with every default filled in. Only an API key may call this.
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/credentials:
    get:
      tags: [Credentials]
      operationId: listAppCredentials
      summary: The application's credentials
      description: The application's credentials, without their secrets. Only an API key may call this.
      responses:
        '200':
          description: The credentials, by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpCredentialPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/credentials/{name}:
    parameters:
      - $ref: '#/components/parameters/CredentialName'
    put:
      tags: [Credentials]
      operationId: putAppCredential
      summary: Store a credential of the application
      description: |
        Stores a credential for an MCP server under a name, or replaces the one that has the name.
        Every session of every user of the application has it, unless the user has one of their own
        for the same server, which comes first.

        A bearer `token` is sent to the server as it is. With `oauth`, the agent platform refreshes
        the access token by itself when it has a refresh token. A replaced token is used from the
        next call on, also by conversations under way. One credential per server: a second name for
        the same server is a 409. Only an API key may call this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpCredentialRequest'
            example:
              mcp_server_url: https://mcp.acme.example/tickets
              token: tk_live_example
      responses:
        '200':
          description: Stored, without its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpCredentialView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`conflict`: another credential of the vault is for the same server.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Credentials]
      operationId: deleteAppCredential
      summary: Delete a credential of the application
      description: The agent platform drops the secret; the agent calls the server without it. Only an API key may call this.
      responses:
        '204':
          description: Deleted, or there was none.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/credentials:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Credentials]
      operationId: listUserCredentials
      summary: A user's own credentials
      description: The user's own credentials, without their secrets. An API key or the user's own token may call this.
      responses:
        '200':
          description: The credentials, by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpCredentialPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/credentials/{name}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/CredentialName'
    put:
      tags: [Credentials]
      operationId: putUserCredential
      summary: Store a credential of a user
      description: |
        As for the application's credentials, for one user: the user's own account at a server, for
        example after the user connected it with OAuth in the application. The user's sessions have
        it before the application's credential for the same server. The user's first credential
        starts their conversations in new sessions at their next turn, which then have it.

        An API key or the user's own token may call this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpCredentialRequest'
            example:
              mcp_server_url: https://mcp.notes.example/mcp
              oauth:
                access_token: at_example
                expires_at: '2026-11-21T10:00:00Z'
                refresh_token: rt_example
                client_id: acme-agent
                token_endpoint: https://auth.notes.example/oauth/token
      responses:
        '200':
          description: Stored, without its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpCredentialView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`conflict`: another credential of the user is for the same server.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Credentials]
      operationId: deleteUserCredential
      summary: Delete a credential of a user
      description: An API key or the user's own token may call this.
      responses:
        '204':
          description: Deleted, or there was none.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/messages:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Conversations]
      operationId: postMessage
      summary: Send a user's message
      description: |
        Stores a message of the user and gets it to the agent. **202 means stored, not answered**: the
        agent's reply appears among the user's messages a little later, with a higher `seq`.

        Messages that arrive close together are answered together, in one reply. The call is
        idempotent on `message_id`: the same id with the same text returns the earlier receipt with
        `deduped: true`; the same id with another text is a 409.

        An API key may call this for any user of its application, a user token for its own user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageRequest'
            example:
              message_id: m-1001
              text: Where is my order 1234?
      responses:
        '202':
          description: 'Stored now, or stored before (`deduped: true`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAccepted'
              example:
                message_id: m-1001
                conversation_id: default
                seq: 7
                created_at: '2026-11-20T10:00:00Z'
                deduped: false
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `conflict`: the `message_id` was already used for another message of the conversation, or
            the conversation is served by another agent than the one named.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The text is too long (`payload_too_large`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [Conversations]
      operationId: listMessages
      summary: Read a user's messages
      description: |
        Returns what the user and the agent said, in the order of `seq`. To wait for a reply, call
        again with `after` set to the `next_after` of the last page until something comes.

        An API key may call this for any user of its application, a user token for its own user.
      parameters:
        - name: conversation_id
          in: query
          description: Only this conversation. All of the user's conversations when absent.
          schema:
            type: string
        - name: after
          in: query
          description: Only messages with a `seq` greater than this.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The messages, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/events:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Events]
      operationId: postEvent
      summary: Tell the agent that something happened
      description: |
        Hands the agent an event from the application's own systems that concerns the user: an order
        shipped, a ticket was answered, a payment failed. **202 means stored, not handled.** A little
        later the agent reads the event, in the background, and decides what to do about it. If it
        finds that the user needs to know or to do something, it sends them a message, which appears
        among the user's messages with `kind: notification`. Often it will find that nothing needs
        saying, and say nothing.

        Events with the same `subject` are handled one after the other, by an agent that remembers the
        earlier ones; events that arrive close together are handled together. Events with different
        subjects do not wait for each other, and none of them makes a conversation wait.

        An event for a main agent (an agent with a `coordinator` block) is the exception: it goes to
        the session of the conversation `conversation_id`, which that agent serves, whatever its
        subject. The main agent then knows of everything that happens for the user, and decides
        itself what to hand to a worker.

        In a conversation that a main agent serves, an event for another agent (`agent`) does not
        get a session that the main agent knows nothing of. It becomes a task of the main agent,
        which the receipt names in `task_id`: the agent handles the event as a worker, the main
        agent is told of it at once, and the worker reports to the main agent, which decides what
        the user hears. Events of one `subject` go to the same task while it is open.

        The agent reads `data` as information from another system, not as instructions: text in it
        that tells the agent what to do is not obeyed. Say what the agent should do with a kind of
        event in the agent's `instructions`.

        The call is idempotent on `event_id`: the same id with the same content returns the earlier
        receipt with `deduped: true`; the same id with other content is a 409.

        Only an API key may call this. The agent takes an event as the application's word, which a
        user's client cannot give.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostEventRequest'
            example:
              event_id: order-1234-delayed
              type: order.delayed
              subject: order-1234
              data:
                order_id: '1234'
                new_delivery_date: '2026-11-27'
                reason: carrier backlog
      responses:
        '202':
          description: 'Stored now, or stored before (`deduped: true`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccepted'
              example:
                event_id: order-1234-delayed
                type: order.delayed
                subject: order-1234
                conversation_id: default
                created_at: '2026-11-20T10:00:00Z'
                deduped: false
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `conflict`: the `event_id` was already used for another event of the user, the subject is
            handled by another agent than the one named, or the event is for a main agent and the
            conversation is served by another agent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: '`data` is too large (`payload_too_large`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/conversations/{conversation_id}/stop:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Conversations]
      operationId: stopConversation
      summary: Stop the reply
      description: |
        Stops the agent's reply in a conversation. The user's messages so far are not answered any
        more: a reply under way stops a moment later and is dropped, and one that has not begun does
        not begin. What the conversation waits for people to decide is withdrawn. A message sent after
        the stop is answered as usual. Other conversations and work in the background go on.

        An API key may call this for any user of its application, a user token for its own user.
      responses:
        '202':
          description: The stop is on record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/schedules:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Schedules]
      operationId: createSchedule
      summary: Set up a schedule
      description: |
        Has the agent do something for the user at a given time: once, at `at`, or again and again, on
        a `cron` rule read in the user's `time_zone`. When the time comes the agent works on it in the
        background, with the application's `instructions`, and tells the user with a notification if
        it finds that it should.

        Schedules of the same `subject` are handled by an agent that remembers the earlier runs, and
        share it with events of that subject. A schedule of a main agent runs in the session of the
        conversation `conversation_id` instead, like its events. A schedule runs at most once a minute.
        After an outage, a repeating schedule runs once for what it missed, and the agent is told that
        it comes late.

        In a conversation that a main agent serves, a schedule that names another agent is that
        agent's to do, as a worker: each time it is due it becomes part of a task of the main agent,
        kept under the schedule's `subject`. The worker gets the application's `instructions`, the
        main agent is told at once, and the worker reports to the main agent, which is the one that
        tells the user.

        The call is idempotent on `schedule_id`: the same id with the same content returns the
        schedule with 200; with other content it is a 409.

        Only an API key may set a schedule up: the agent takes its instructions as the application's.
        The agent also sets follow-ups for itself, which are listed here too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
            example:
              schedule_id: morning-brief
              name: Morning brief
              instructions: Look at the user's open orders and tell them about anything that needs them today.
              cron: 0 8 * * 1-5
              time_zone: Asia/Shanghai
              subject: orders
      responses:
        '201':
          description: Set up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleView'
        '200':
          description: Set up before, with the same content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `conflict`: the `schedule_id` was already used for another schedule of the user, the
            subject is handled by another agent than the one named, or the schedule is for a main
            agent and the conversation is served by another agent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [Schedules]
      operationId: listSchedules
      summary: The user's schedules
      description: |
        Returns the user's active schedules, oldest first: the application's, and the follow-ups the
        agent set itself. An API key or the user's own token may call this.
      responses:
        '200':
          description: The schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/schedules/{schedule_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Schedules]
      operationId: cancelSchedule
      summary: Cancel a schedule
      description: |
        The schedule does not run again. Cancelling one that ended already changes nothing. An API key
        or the user's own token may call this, so that users can stop what the agent does for them.
      responses:
        '204':
          description: Cancelled.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: What the main agent has handed to workers
      description: |
        Returns the user's tasks, newest first, at most 200: the pieces of work that a main agent
        delegated to workers. A task is `proposed` while it waits for the user's confirmation and
        has not started, `queued` while its worker has not taken up what the main agent last sent,
        `working` while a turn of the worker is under way, `idle` when the worker has reported and
        waits, and `closed` when it is over.

        Nobody but a main agent makes a task: it does when it finds, in a conversation or because
        of something that happened, that a piece of work is better done by a worker. An API key or
        the user's own token may call this; only an API key gets `report`, the beginning of what
        each task's worker last reported.
      parameters:
        - name: conversation_id
          in: query
          description: Only the tasks that the main agent of this conversation delegated.
          schema:
            type: string
        - name: status
          in: query
          description: |
            `open` (the default) leaves the closed tasks out; `proposed` returns only the tasks that
            wait for the user's confirmation; `all` returns every task.
          schema:
            type: string
            enum: [open, proposed, all]
      responses:
        '200':
          description: The tasks, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Look at one task
      description: |
        Returns the task, whatever its status. With an API key the answer also has `report` and
        `notes`: everything the main agent and the worker told each other, oldest first. A user
        token gets the task without them, because a worker may have read what only the application
        is to see; what the user is told of a task is what the main agent tells them.
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/tasks/{task_id}/close:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: closeTask
      summary: Close a task
      description: |
        Ends a task. A worker that is working on it stops a moment later, and nothing more comes
        from it; what it waits for people to decide is withdrawn, and the follow-ups it set for
        itself are cancelled. The main agent is told that the task was closed, and by whom. Closing
        a task that is closed already changes nothing.

        Closing a task that waits for the user's confirmation declines it: it never starts, and the
        main agent is told that it was declined.

        An API key or the user's own token may call this, so that users can stop what the agent does
        for them.
      responses:
        '200':
          description: The task, closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/tasks/{task_id}/start:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: startTask
      summary: Confirm a task that waits for it
      description: |
        Confirms a `proposed` task, so that its worker starts on it. The task is `queued` from then
        on, and `authorized_by` says who confirmed it: `user` for the user's own token, `app` for an
        API key. The main agent is not woken by the confirmation; the worker's report wakes it.
        Confirming a task that has started already changes nothing.

        A task waits for a confirmation until `expires_at`. After that it is closed, and confirming
        it is a 409, as it is for a task that was closed for any other reason.

        To decline a task, close it.
      responses:
        '200':
          description: The task, started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`conflict`: the task is closed, or waited too long for a confirmation.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/grants:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Tasks]
      operationId: listGrants
      summary: What the user's main agents may start unasked
      description: |
        Returns the user's standing authorisations, by main agent and role. With one, the main
        agent starts the tasks of that role on its own initiative without asking the user each
        time; without one, such a task waits for the user's confirmation. An API key or the user's
        own token may call this.
      responses:
        '200':
          description: The authorisations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/grants/{agent_key}/{role}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - name: agent_key
        in: path
        required: true
        description: The key of the main agent.
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
      - name: role
        in: path
        required: true
        description: A role of the main agent's list of workers.
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
    put:
      tags: [Tasks]
      operationId: grantRole
      summary: Let the main agent start tasks of a role unasked
      description: |
        Gives the user's standing authorisation for a role: from now on the main agent starts the
        tasks of that role for this user without asking each time. It does not start the tasks
        that wait for a confirmation already; confirm those. Giving an authorisation that is there
        already changes nothing.

        The request has no body. An API key or the user's own token may call this: the
        authorisation is the user's to give, and the application can give it for them. It is a 400
        for a role whose `start` is `always_ask`, for which the application allows none.
      responses:
        '200':
          description: The authorisation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Tasks]
      operationId: revokeGrant
      summary: Take a standing authorisation back
      description: |
        From now on the main agent's own tasks of the role wait for the user's confirmation again.
        Tasks that have started go on. Taking back an authorisation that is not there changes
        nothing. An API key or the user's own token may call this.
      responses:
        '204':
          description: Taken back.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/preferences:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Tasks]
      operationId: getPreferences
      summary: What the user wants of their agents
      description: |
        Returns the user's own settings. For now there is one: `proactivity`, how much the user
        wants to hear from their main agent without having asked. It is absent while the user has
        none; the default of the main agent then applies (`coordinator.proactivity`), and where
        that has none, the service's, which is `proactive` unless configured otherwise. An API key
        or the user's own token may call this.
      responses:
        '200':
          description: The user's settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [Tasks]
      operationId: setPreferences
      summary: Set what the user wants of their agents
      description: |
        Sets how forward the user wants their main agent, from now on.

        | `proactivity` | The main agent is woken at once | It tells the user | Work of its own initiative |
        | --- | --- | --- | --- |
        | `proactive` | Whenever anything happens to a task | What has started, what waits for them, what came of it | Offered, or started where it may |
        | `balanced` | When a worker reports or fails, a task is closed, or a worker waits for the user | What needs them, and what came of it | Offered, or started where it may |
        | `quiet` | When a worker reports or fails, or a task is closed | Only what needs their decision, and the outcome of what they asked for | Not offered; started only where the user or the application allowed it |

        Whatever the level, the main agent knows of everything: what does not wake it is given to
        its next turn. A user who wants it `quiet` is also sent fewer notifications in a day.

        The request holds all of the user's settings: a `proactivity` that is left out or `null`
        takes the user's own setting away, and the agent's default applies again. An API key or the
        user's own token may call this; the main agent sets it too, when the user tells it so in
        the conversation. A change is recorded as a `preferences.updated` update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesRequest'
            example:
              proactivity: balanced
      responses:
        '200':
          description: The user's settings as they are now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/updates:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Updates]
      operationId: listUpdates
      summary: Read a user's updates
      description: |
        Returns what happened for the user after `after`, oldest first: `message.created` for every
        message, the user's and the agent's; `action.created` and `action.resolved` for what waits
        for a decision; `run.failed` when the agent could not finish a reply or a piece of work in
        the background. Every update has a `seq`, which only grows: call again with `after` set to
        the `next_after` of the last page, and nothing is missed.

        An API key may call this for any user of its application, a user token for its own user.
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: The updates, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/stream:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Updates]
      operationId: streamUpdates
      summary: Follow a user's updates live
      description: |
        The user's updates as server-sent events, as they happen. Each event has the update's `seq`
        as its `id`, its type as its `event`, and the update as JSON in its `data`. A quiet stream
        sends a comment every 15 seconds.

        The stream starts after the `Last-Event-ID` header, else after `after`, else with what happens
        from now on. A connection ends after 15 minutes; a client that connects again with the id of
        the last event it got misses nothing. Browsers' `EventSource` does that by itself.

        `EventSource` cannot send an `Authorization` header. A browser opens the stream with a
        ticket instead, which the application's back end or the user's client gets first:
        `GET /v1/users/{user_id}/stream?ticket=<ticket>`.
      security:
        - Bearer: []
        - StreamTicket: []
      parameters:
        - name: after
          in: query
          description: Start after this `seq`.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Last-Event-ID
          in: header
          description: The id of the last event the client got; it wins over `after`.
          schema:
            type: string
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 42
                event: message.created
                data: {"id":"upd_01JCX3S6Q4Z1R4J4N4V5B2W9Y7","seq":42,"user_id":"u42","type":"message.created","created_at":"2026-11-20T10:00:00Z","data":{"seq":7,"message_id":"reply:run_01JCX3","conversation_id":"default","role":"agent","kind":"reply","text":"Your order is on its way.","created_at":"2026-11-20T10:00:00Z"}}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/stream-tickets:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Updates]
      operationId: issueStreamTicket
      summary: Get a ticket for the stream
      description: |
        A ticket opens the user's stream once, within a minute, without a header. An API key may get
        one for any user of its application, a user token for its own user.
      responses:
        '201':
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamTicket'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/webhook:
    put:
      tags: [Updates]
      operationId: putWebhook
      summary: Set up the webhook
      description: |
        Has every update of every user of the application delivered to `url`, by a POST each, with
        the update as JSON. A delivery is signed: it carries `webhook-id` (the update's `id`),
        `webhook-timestamp` (seconds since the epoch) and `webhook-signature`: `v1,` followed by the
        Base64 of HMAC-SHA256 over `<id>.<timestamp>.<body>`, keyed with the secret's bytes (the part
        after `whsec_`, Base64-decoded). Check the signature and the timestamp, and ignore an `id`
        you have seen: a delivery can come twice. Order by `seq`, per user.

        Any 2xx answer is a success. Anything else, or no answer within 10 seconds, is tried again:
        after 10 seconds, a minute, 5 minutes, 30 minutes, 2, 6 and 12 hours. When the last attempt
        fails, the service turns the webhook off; a PUT with `enabled: true` turns it on again.
        Updates that came while it was off are not delivered then; read them with
        `GET /v1/users/{user_id}/updates`.

        The URL must be https, on the public internet: addresses of private networks, loopback,
        link-local addresses and the like are refused, when the webhook is set up and on every
        delivery. Redirects are not followed.

        The signing secret is in the answer when it is made: when the webhook is first set up, and
        with `rotate_secret: true`. It is not shown again. Only an API key may call this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
            example:
              url: https://api.acme.example/agent-updates
              events: [message.created, action.created]
      responses:
        '200':
          description: The webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [Updates]
      operationId: getWebhook
      summary: Look at the webhook
      description: The webhook, without its secret. Only an API key may call this.
      responses:
        '200':
          description: The webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Updates]
      operationId: deleteWebhook
      summary: Remove the webhook
      description: Nothing is delivered any more; what was waiting to be delivered is dropped. Only an API key may call this.
      responses:
        '204':
          description: Removed, or there was none.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/actions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Actions]
      operationId: listActions
      summary: What waits for a decision
      description: |
        Returns the user's actions that wait for a decision, oldest first, at most 100.

        An action is a tool call that needs somebody's approval, or a question the agent asked the
        user. The agent's turn stands still until the action is decided, until it expires (after 24
        hours by default; the agent is then told that nobody decided), or until something new
        happens on its line: a new message in the conversation, a new event for the subject. New
        input withdraws what waits, and comes in the agent's next turn. A question in a
        conversation is the exception: a message to that conversation answers the latest one.

        An API key sees every action of the user; a user token only the ones the user decides
        (`approver: user`).
      parameters:
        - name: conversation_id
          in: query
          description: Only the actions of this conversation.
          schema:
            type: string
      responses:
        '200':
          description: The actions that wait, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/actions/{action_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ActionId'
    get:
      tags: [Actions]
      operationId: getAction
      summary: Look at one action
      description: Returns the action, whatever its status. A user token sees only the actions the user decides.
      responses:
        '200':
          description: The action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/actions/{action_id}/resolve:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ActionId'
    post:
      tags: [Actions]
      operationId: resolveAction
      summary: Decide an action
      description: |
        Approves or denies a tool call, or answers a question, and wakes the agent's turn to go on.

        - An approval takes `decision: approve` or `decision: deny`. A denial may say why, in
          `message`; the agent is given it.
        - A question takes an `answer`. The answer also appears among the conversation's messages,
          as the user's. `decision: deny` declines the question instead.

        Whoever decides first decides: a decision is never undone. Deciding again the same way
        returns the action unchanged. Deciding otherwise, or deciding an action that expired or was
        withdrawn, is a 409.

        An API key may decide every action of its users; a user token only the ones the user decides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveActionRequest'
            example:
              decision: approve
      responses:
        '200':
          description: The action, with its outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`conflict`: the action was decided otherwise already, or it expired or was withdrawn.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/users/{user_id}/tokens:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: issueUserToken
      summary: Issue a user token
      description: |
        Returns a token for one user, to hand to that user's client. The user need not exist yet. Only
        an API key may call this: the application's back end is the one that knows who the user is.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTokenRequest'
            example:
              ttl_seconds: 600
      responses:
        '201':
          description: The token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Users]
      operationId: revokeUserTokens
      summary: Revoke a user's tokens
      description: |
        Invalidates every token of the user that is out, for example when the user signs out
        everywhere. Tokens issued afterwards work. Only an API key may call this.
      responses:
        '204':
          description: Revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/apps:
    post:
      tags: [Admin]
      operationId: createApp
      summary: Register an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
            example:
              app_id: acme
              name: Acme Support
      responses:
        '201':
          description: The application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An application with that id exists already (`conflict`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [Admin]
      operationId: listApps
      summary: List applications
      responses:
        '200':
          description: The applications, by id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/apps/{app_id}:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [Admin]
      operationId: getApp
      summary: Read an application
      responses:
        '200':
          description: The application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Admin]
      operationId: updateApp
      summary: Rename or suspend an application
      description: |
        Changes the name, the status, or both. While an application is `suspended` its API keys and
        its users' tokens are refused; nothing is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppRequest'
            example:
              status: suspended
      responses:
        '200':
          description: The application after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/apps/{app_id}/keys:
    parameters:
      - $ref: '#/components/parameters/AppId'
    post:
      tags: [Admin]
      operationId: createApiKey
      summary: Create an API key
      description: |
        Returns a new API key of the application. The key is in this response and nowhere else
        afterwards: the service keeps only a hash of it. An application can have several keys, which
        is how a key is replaced without downtime.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
            example:
              label: production back end
      responses:
        '201':
          description: The key, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [Admin]
      operationId: listApiKeys
      summary: List API keys
      description: Lists the application's keys, oldest first, without their secrets. Revoked keys are included.
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/apps/{app_id}/keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - name: key_id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Admin]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: The key stops working at once. Revoking a key twice is fine.
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    StreamTicket:
      type: apiKey
      in: query
      name: ticket
      description: A ticket from `POST /v1/users/{user_id}/stream-tickets`. Opens that user's stream, once.
    Bearer:
      type: http
      scheme: bearer
      description: An API key, a user token or an administration key.

  parameters:
    AppId:
      name: app_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{1,39}$'
    UserId:
      name: user_id
      in: path
      required: true
      description: The application's own id for the user.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$'
    CredentialName:
      name: name
      in: path
      required: true
      description: The caller's name for the credential.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,63}$'
    ActionId:
      name: action_id
      in: path
      required: true
      description: The action, as the service named it.
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      description: The task, as the service named it.
      schema:
        type: string

  responses:
    InvalidRequest:
      description: Malformed JSON, an unknown field, or a missing or invalid value (`invalid_request`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: The credential is missing, unknown, expired or revoked (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: unknown or revoked API key
            code: unauthenticated
    Forbidden:
      description: |
        The credential is valid but not for this call (`forbidden`): the wrong kind of credential, a
        user token used for another user, or a suspended application.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such object in this application (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: |
        Something the service depends on cannot be reached right now (`unavailable`). Nothing was
        changed; the same request can be sent again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: |
        `rate_limited`: the caller made too many requests. An application's API keys share a bucket
        of 100 requests that refills by 50 a second; a user token has one of 20 that refills by 5 a
        second (the defaults). Try again after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error:
      description: Any other error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: Error body. `code` is the stable, machine-readable part.
      required: [status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - invalid_request
            - unauthenticated
            - forbidden
            - not_found
            - conflict
            - payload_too_large
            - rate_limited
            - unavailable
            - internal_error

    Whoami:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [admin, app, user]
        app_id:
          type: string
          description: Absent for an administrator.
        user_id:
          type: string
          description: Present for a user token only.

    SandboxConfig:
      type: object
      additionalProperties: false
      description: |
        The agent's own computer: a shell and file tools in a container that exists for one
        conversation. Off unless enabled.
      properties:
        enabled:
          type: boolean
          description: Whether the agent has the container tools at all. Every other setting here needs it.
        web_search:
          type: boolean
          description: Whether the agent may search the web. Needs a network that is not `none`.
        web_fetch:
          type: boolean
          description: Whether the agent may read web pages. Needs a network that is not `none`.
        network:
          type: string
          enum: [none, limited, unrestricted]
          description: What the container may reach. `limited` means only `allowed_hosts`.
        allowed_hosts:
          type: array
          maxItems: 50
          items:
            type: string
          description: The hosts a `limited` container may reach, as plain host names such as `api.example.com`.

    McpServerConfig:
      type: object
      additionalProperties: false
      description: |
        A third-party system the agent reaches over MCP. Its credential is not part of the agent's
        configuration.
      required: [name, url]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          description: A short name, unique within the agent.
        url:
          type: string
          description: The server's HTTPS endpoint.
        approval:
          type: string
          enum: [always_ask, auto, always_allow]
          description: |
            When a call of one of the server's tools needs approval. `always_ask` (the default) asks
            every time; `auto` lets the platform judge each call; `always_allow` never asks.
        approver:
          type: string
          enum: [app, user]
          description: |
            Who approves. `app` (the default) is the application's back end; `user` is the end user,
            in the application's client.

    WorkerConfig:
      type: object
      additionalProperties: false
      description: An agent that a main agent may hand work to, under the name of what it does there.
      required: [role, agent, description]
      properties:
        role:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
          description: The name the main agent delegates under, unique within the main agent, for example `researcher`.
        agent:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          description: |
            The key of the agent that does the work: another agent of the application, which exists
            already and is not a main agent itself.
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: What this worker is good for. The main agent reads it when it decides whom to give a task.
        start:
          type: string
          enum: [ask, always_ask, always_allow]
          description: |
            When a task of this role may start. `ask`, which it is when absent: what the user asks
            for in a conversation starts at once, and a task that the main agent begins on its own
            initiative waits for the user's confirmation, unless the user has given a standing
            authorisation for the role. `always_ask`: every task of the role waits for the user's
            confirmation, and no standing authorisation is possible. `always_allow`: every task
            starts at once.

    CoordinatorConfig:
      type: object
      additionalProperties: false
      description: |
        Makes the agent a main agent. In a conversation it serves, the application's events and
        schedules for it are handled in the conversation's own session rather than in a session per
        subject, so that it knows of everything that happens for the user. It hands work to its
        workers, which run in sessions of their own and report back to it.
      properties:
        workers:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/WorkerConfig'
          description: The agents it may delegate to. None when absent; the main agent then does everything itself.
        max_active_tasks:
          type: integer
          minimum: 1
          maximum: 20
          description: |
            How many tasks of one conversation may be queued or being worked on at a time. 4 when
            absent.
        proactivity:
          type: string
          enum: [proactive, balanced, quiet]
          description: |
            How forward the main agent is with a user who has not said how they want it; see
            `PUT /v1/users/{user_id}/preferences` for what each level means. The service's default
            when absent, which is `proactive` unless configured otherwise.

    AgentProfileRequest:
      type: object
      additionalProperties: false
      required: [name, instructions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: A name for people.
        model:
          type: string
          description: The Claude model. `claude-opus-5-5` when absent.
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
          description: How hard the model thinks. The model's own default when absent.
        instructions:
          type: string
          minLength: 1
          maxLength: 50000
          description: |
            What the agent is for and how it should behave. The service adds its own short notes on
            how the agent is woken and how it reaches the user.
        sandbox:
          $ref: '#/components/schemas/SandboxConfig'
        memory:
          type: string
          enum: [none, per_user]
          description: |
            `per_user`: the agent keeps notes about each user across sessions, in files of its
            sandbox, which must be enabled. It writes them in conversations and only reads them in
            the background, where it works on what other systems say. `none` when absent.
        session_budget_usd:
          type: number
          minimum: 0.01
          maximum: 10000
          description: |
            What one session of the agent may spend at most, in US dollars. A conversation whose
            session has spent it goes on in a new one. No limit when absent.
        mcp_servers:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/McpServerConfig'
        coordinator:
          $ref: '#/components/schemas/CoordinatorConfig'

    AgentProfileView:
      type: object
      description: An agent of an application, with every default filled in.
      required: [agent_key, name, model, instructions, sandbox, mcp_servers, revision, created_at, updated_at]
      properties:
        agent_key:
          type: string
        name:
          type: string
        model:
          type: string
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
        instructions:
          type: string
        sandbox:
          $ref: '#/components/schemas/SandboxConfig'
        memory:
          type: string
          enum: [none, per_user]
          description: |
            `per_user`: the agent keeps notes about each user across sessions, in files of its
            sandbox, which must be enabled. It writes them in conversations and only reads them in
            the background, where it works on what other systems say. `none` when absent.
        session_budget_usd:
          type: number
          minimum: 0.01
          maximum: 10000
          description: |
            What one session of the agent may spend at most, in US dollars. A conversation whose
            session has spent it goes on in a new one. No limit when absent.
        mcp_servers:
          type: array
          items:
            $ref: '#/components/schemas/McpServerConfig'
        coordinator:
          $ref: '#/components/schemas/CoordinatorConfig'
        revision:
          type: integer
          description: Counts the changes of the configuration, from 1.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PostMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        message_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,63}$'
          description: |
            The caller's id for the message, unique within the conversation. It makes a retry
            harmless. The service makes one up when it is absent.
        conversation_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,63}$'
          description: Which conversation of the user. `default` when absent. A conversation exists from its first message.
        agent:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          description: The key of the agent that serves the conversation. `default` when absent. Fixed by the first message.
        text:
          type: string
          minLength: 1
          maxLength: 32000

    MessageAccepted:
      type: object
      required: [message_id, conversation_id, seq, created_at, deduped]
      properties:
        message_id:
          type: string
        conversation_id:
          type: string
        seq:
          type: integer
          format: int64
          description: The message's position in the user's stream. Replies have higher ones.
        created_at:
          type: string
          format: date-time
        deduped:
          type: boolean
          description: True when a message with this id had been accepted before; that one is returned.
        action_id:
          type: string
          description: |
            Present when the agent was waiting for the user to answer a question in this
            conversation: the question that this message answered. The agent goes on with it as
            the answer, rather than as a new message, and no other reply to it comes.

    MessageView:
      type: object
      required: [seq, message_id, conversation_id, role, kind, text, created_at]
      properties:
        seq:
          type: integer
          format: int64
          description: The position in the user's stream, across the user's conversations. It only grows.
        message_id:
          type: string
        conversation_id:
          type: string
        role:
          type: string
          enum: [user, agent]
        kind:
          type: string
          enum: [message, reply, notification, question, proposal]
          description: |
            `message` is what the user said, `reply` the agent's answer to it, `notification`
            something the agent said of its own accord, `question` a question the agent waits for
            the user to answer. Writing to the conversation answers the latest question that waits.
            `proposal` is work that a main agent offers to do and that waits for the user's
            confirmation: the text is the agent's summary of it, and `task_id` names the task.
        text:
          type: string
        created_at:
          type: string
          format: date-time
        action_id:
          type: string
          description: |
            For a question: the action that waits for the answer. For a message of the user: the
            question it answered, if it did.
        task_id:
          type: string
          description: For a proposal, the task that waits for the user's confirmation.

    MessagePage:
      type: object
      required: [messages, next_after]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageView'
        next_after:
          type: integer
          format: int64
          description: |
            What to pass as `after` to get what comes next: the last `seq` on this page, or the `after`
            that was asked with when the page is empty.

    PostEventRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        event_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,63}$'
          description: |
            The caller's id for the event, unique for the user. It makes a retry harmless. The service
            makes one up when it is absent.
        type:
          type: string
          pattern: '^[a-z0-9][a-z0-9_.-]{0,63}$'
          description: |
            What happened, in the application's own words, for example `order.shipped`. Types that
            start with `agent.` are the service's own and are refused.
        subject:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,63}$'
          description: |
            What it happened to, for example `order-1234`. Events with the same subject are handled
            one after the other by an agent that remembers the earlier ones. The `type` when absent.
        agent:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          description: The key of the agent that handles the subject. `default` when absent. Fixed by the subject's first event.
        conversation_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,63}$'
          description: The conversation in which the user is told, if the agent decides to tell them. `default` when absent.
        data:
          type: object
          additionalProperties: true
          description: |
            The details, at most 16 KB. Pass ids and facts; for large content, pass a reference that
            the agent can follow with one of its tools.
        deliver_at:
          type: string
          format: date-time
          description: Do not handle the event before this time, at most 366 days ahead. At once when absent or past.

    EventAccepted:
      type: object
      required: [event_id, type, subject, conversation_id, created_at, deduped]
      properties:
        event_id:
          type: string
        type:
          type: string
        subject:
          type: string
        conversation_id:
          type: string
        created_at:
          type: string
          format: date-time
        deliver_at:
          type: string
          format: date-time
          description: When the event will be handled at the earliest. Absent when that is at once.
        deduped:
          type: boolean
          description: True when an event with this id had been accepted before; that one is returned.
        task_id:
          type: string
          description: |
            For an event that went to a worker in a conversation that a main agent serves: the task
            of the main agent that it became part of.

    Update:
      type: object
      required: [id, seq, user_id, type, created_at, data]
      properties:
        id:
          type: string
          description: Unique. A receiver that gets an update twice can tell by it.
        seq:
          type: integer
          format: int64
          description: The position in the user's log. It only grows.
        user_id:
          type: string
        type:
          type: string
          enum: [message.created, action.created, action.resolved, run.failed, task.created, task.updated, preferences.updated]
        created_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          description: |
            For `message.created`, the message (a MessageView). For `action.created` and
            `action.resolved`, the action (an ActionView). For `task.created` and `task.updated`,
            the task (a TaskView, without its notes). For `preferences.updated`, the user's settings
            (a PreferencesView). For `run.failed`: `run_id`, then `conversation_id`, `subject` or
            `task_id`, and `error`.

    UpdatePage:
      type: object
      required: [updates, next_after]
      properties:
        updates:
          type: array
          items:
            $ref: '#/components/schemas/Update'
        next_after:
          type: integer
          format: int64
          description: What to pass as `after` to get what comes next.

    StreamTicket:
      type: object
      required: [ticket, expires_at]
      properties:
        ticket:
          type: string
        expires_at:
          type: string
          format: date-time

    WebhookRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2000
          description: An https URL on the public internet.
        events:
          type: array
          items:
            type: string
            enum: [message.created, action.created, action.resolved, run.failed, task.created, task.updated, preferences.updated]
          description: The types to deliver. All when absent.
        enabled:
          type: boolean
          description: false pauses deliveries; true starts them again after the service stopped them.
        rotate_secret:
          type: boolean
          description: true makes a new signing secret, which the answer shows once.

    WebhookView:
      type: object
      required: [url, state, created_at, updated_at]
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string
        state:
          type: string
          enum: [active, disabled]
        disabled_reason:
          type: string
        signing_secret:
          type: string
          description: Only when it was just made.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StopResult:
      type: object
      required: [conversation_id, stopped_through, in_progress]
      properties:
        conversation_id:
          type: string
        stopped_through:
          type: integer
          format: int64
          description: The user's messages up to this `seq` are not answered any more.
        in_progress:
          type: boolean
          description: Whether a reply was under way, or messages were waiting for one.

    CreateScheduleRequest:
      type: object
      additionalProperties: false
      required: [name, instructions]
      properties:
        schedule_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,63}$'
          description: The caller's id for the schedule, unique for the user. The service makes one up when it is absent.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: A short name, for lists.
        instructions:
          type: string
          minLength: 1
          maxLength: 4000
          description: What the agent is to do when the time comes. The agent takes them as the application's instructions.
        at:
          type: string
          format: date-time
          description: When, for a schedule that runs once. In the future, at most 366 days ahead.
        cron:
          type: string
          description: When, for a schedule that repeats. Five fields, minute first, for example `0 8 * * 1-5`.
        time_zone:
          type: string
          description: The IANA zone the cron rule is read in, for example `Asia/Shanghai`. UTC when absent. Only with `cron`.
        subject:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,63}$'
          description: The line the agent works on, as for events. `schedule-<schedule_id>` when absent.
        agent:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          description: The key of the agent that does it. `default` when absent.
        conversation_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,63}$'
          description: The conversation in which the user is told, if the agent tells them. `default` when absent.

    ScheduleView:
      type: object
      required: [schedule_id, created_by, kind, agent, conversation_id, state, created_at]
      properties:
        schedule_id:
          type: string
        created_by:
          type: string
          enum: [app, agent]
          description: '`agent` for a follow-up the agent set itself.'
        kind:
          type: string
          enum: [once, cron]
        name:
          type: string
        instructions:
          type: string
        note:
          type: string
          description: For a follow-up, the agent's note to itself.
        at:
          type: string
          format: date-time
        cron:
          type: string
        time_zone:
          type: string
        subject:
          type: string
          description: |
            The subject it runs on, or, for what a main agent's conversation hands to another agent,
            the subject its task is kept under. Absent for what runs on another line: a follow-up in
            a conversation, a schedule of a main agent itself, a follow-up of a worker.
        agent:
          type: string
        conversation_id:
          type: string
        state:
          type: string
          enum: [active, done, cancelled]
        last_fired_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    SchedulePage:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleView'

    TaskNoteView:
      type: object
      description: Something a main agent and a worker told each other about a task, or the application told them.
      required: [seq, from, kind, text, created_at]
      properties:
        seq:
          type: integer
          description: The position within the task, from 1.
        from:
          type: string
          enum: [main, worker, app, service]
          description: |
            `main` for the main agent, `worker` for the worker, `app` for the application, `service`
            for what the service itself notes: a turn of the worker that failed, a task closed from
            outside, a worker that waits for a person.
        kind:
          type: string
          enum: [assignment, message, event, schedule, assigned, waiting, decided, report, failure, closed]
          description: |
            `assignment` starts a task of the main agent and `message` is a later word of it; `event`
            is an event that the application handed to the worker and `schedule` something that the
            application scheduled for the worker and that is due, both as JSON, and `assigned` what
            tells the main agent of either; `waiting` tells the main agent that the worker waits for
            a person's decision, and `decided` what became of it; `report` is what the worker says at
            the end of a turn.
        text:
          type: string
        created_at:
          type: string
          format: date-time

    TaskView:
      type: object
      description: |
        A piece of work of a main agent's worker: the main agent handed it to the worker, or proposes
        to, or the application handed it to the worker itself.
      required: [task_id, conversation_id, role, agent, title, status, created_at, updated_at]
      properties:
        task_id:
          type: string
        conversation_id:
          type: string
          description: The conversation whose main agent the task belongs to.
        role:
          type: string
          description: The role the task was delegated to.
        agent:
          type: string
          description: The key of the agent that works on it.
        title:
          type: string
          description: A short name, as the main agent gave it.
        summary:
          type: string
          description: |
            What the main agent wants to do and why, written for the user. Always there for a task
            that waits for a confirmation: it is what the user decides on.
        status:
          type: string
          enum: [proposed, queued, working, idle, closed]
          description: '`proposed` while the task waits for the user''s confirmation and has not started.'
        authorized_by:
          type: string
          enum: [conversation, user, app, grant, policy]
          description: |
            Why the task was allowed to start. `conversation`: the main agent delegated it, or
            started it, in a turn that the user began. `user`, `app`: the user's own client, or the
            application, confirmed it. `grant`: the user's standing authorisation for the role.
            `policy`: the application lets the role start unasked. Absent while the task waits for
            a confirmation, and for one that was closed before it got one.
        expires_at:
          type: string
          format: date-time
          description: For a task that waits for a confirmation, until when it can be given.
        closed_by:
          type: string
          enum: [agent, user, app, service]
          description: |
            For a closed task. `agent` is the main agent; `service` closes a task that nobody had
            touched, or confirmed, for too long.
        closed_reason:
          type: string
        report:
          type: string
          description: |
            The beginning of what the worker last reported; the notes have all of it. Only for an
            API key, and not in updates.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        notes:
          type: array
          items:
            $ref: '#/components/schemas/TaskNoteView'
          description: Everything the two told each other, oldest first. Only when one task is read with an API key.
        created_by:
          type: string
          enum: [agent, app]
          description: |
            `agent` when the main agent delegated the task, `app` when the application handed work
            to the worker itself: an event, or something it scheduled.
        subject:
          type: string
          description: For a task of the application, the subject of its events and schedules.

    TaskPage:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskView'

    GrantView:
      type: object
      description: |
        A user's standing authorisation: the main agent may start the tasks of one role on its own
        initiative, without asking the user each time.
      required: [agent, role, granted_by, created_at]
      properties:
        agent:
          type: string
          description: The key of the main agent.
        role:
          type: string
          description: The role of its list of workers.
        granted_by:
          type: string
          enum: [user, app]
          description: '`user` when the user''s own client gave it, `app` when the application did for them.'
        created_at:
          type: string
          format: date-time

    GrantPage:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/GrantView'

    PreferencesRequest:
      type: object
      additionalProperties: false
      properties:
        proactivity:
          type: string
          nullable: true
          enum: [proactive, balanced, quiet, null]
          description: |
            How much the user wants to hear from their main agent without having asked. Left out or
            `null`: the user has no setting of their own, and the agent's default applies.

    PreferencesView:
      type: object
      properties:
        proactivity:
          type: string
          enum: [proactive, balanced, quiet]
          description: The user's own setting. Absent when they have none, and the agent's default applies.
        set_by:
          type: string
          enum: [user, app, agent]
          description: |
            Who set it last: `user`, `app`, or `agent` when the user told the main agent in the
            conversation. Absent when it was never set.
        updated_at:
          type: string
          format: date-time
          description: When it was set last. Absent when it was never set.

    OAuthTokens:
      type: object
      additionalProperties: false
      required: [access_token]
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: With it, the agent platform gets new access tokens by itself. Needs `client_id` and `token_endpoint`.
        client_id:
          type: string
        token_endpoint:
          type: string
          description: An https URL.
        token_endpoint_auth:
          type: string
          enum: [none, client_secret_basic, client_secret_post]
          description: How the platform authenticates at the token endpoint. `none` when absent.
        client_secret:
          type: string
          description: For `client_secret_basic` and `client_secret_post`.
        scope:
          type: string

    McpCredentialRequest:
      type: object
      additionalProperties: false
      required: [mcp_server_url]
      properties:
        mcp_server_url:
          type: string
          description: The server's https URL, as the agent's configuration names it. Case, a default port and a trailing slash do not matter.
        token:
          type: string
          maxLength: 8000
          description: A bearer token. Either this or `oauth`.
        oauth:
          $ref: '#/components/schemas/OAuthTokens'

    McpCredentialView:
      type: object
      required: [name, mcp_server_url, kind, created_at, updated_at]
      properties:
        name:
          type: string
        mcp_server_url:
          type: string
        kind:
          type: string
          enum: [bearer, oauth]
        user_id:
          type: string
          description: The user whose credential it is. Absent for the application's.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    McpCredentialPage:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/McpCredentialView'

    ActionTool:
      type: object
      required: [server, name]
      properties:
        server:
          type: string
          description: The MCP server that has the tool.
        name:
          type: string
          description: The tool.
        input:
          type: object
          additionalProperties: true
          description: What the agent passes to the tool, which is what the call would do.

    ActionView:
      type: object
      required: [action_id, kind, status, approver, conversation_id, created_at, expires_at]
      properties:
        action_id:
          type: string
        kind:
          type: string
          enum: [approval, question]
        status:
          type: string
          enum: [pending, approved, denied, answered, expired, withdrawn]
          description: |
            `pending` until somebody decides. `approved`, `denied` or `answered` when a person
            decided; `expired` when nobody did in time; `withdrawn` when it no longer applies,
            because something new happened on its line first.
        approver:
          type: string
          enum: [user, app]
          description: Who decides. `user` is the end user, in the application's client; `app` is the application's back end.
        conversation_id:
          type: string
          description: The conversation the action belongs to.
        tool:
          $ref: '#/components/schemas/ActionTool'
        question:
          type: string
          description: For a question, what the agent asks.
        options:
          type: array
          items:
            type: string
          description: For a question, answers the agent suggests. Any other answer is fine too.
        answer:
          type: string
          description: For an answered question, the answer.
        note:
          type: string
          description: Why it was denied, expired or withdrawn, as the agent is told.
        resolved_by:
          type: string
          enum: [user, app, service]
          description: Who decided. `service` for an expiry or a withdrawal.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When nobody deciding counts as no decision.
        resolved_at:
          type: string
          format: date-time
      example:
        action_id: act_01JCX3S6Q4Z1R4J4N4V5B2W9Y7
        kind: approval
        status: pending
        approver: user
        conversation_id: default
        tool:
          server: tickets
          name: close_ticket
          input:
            id: T-1
        created_at: '2026-11-20T10:00:00Z'
        expires_at: '2026-11-21T10:00:00Z'

    ActionPage:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionView'

    ResolveActionRequest:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, deny]
          description: For an approval, required. For a question, `deny` declines it; leave it out to answer.
        answer:
          type: string
          minLength: 1
          maxLength: 4000
          description: For a question, the answer.
        message:
          type: string
          minLength: 1
          maxLength: 1000
          description: With a denial, why. The agent is given it.

    IssueTokenRequest:
      type: object
      additionalProperties: false
      properties:
        ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          description: How long the token is valid. 15 minutes when absent; at most 1 hour unless the service is configured otherwise.

    IssuedToken:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: 'Sent as `Authorization: Bearer <token>`.'
        expires_at:
          type: string
          format: date-time

    CreateAppRequest:
      type: object
      additionalProperties: false
      required: [app_id, name]
      properties:
        app_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,39}$'
          description: Chosen by the operator. It cannot be changed.
        name:
          type: string
          minLength: 1
          maxLength: 200

    UpdateAppRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [active, suspended]

    AppView:
      type: object
      required: [app_id, name, status, created_at]
      properties:
        app_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, suspended]
        created_at:
          type: string
          format: date-time

    CreateKeyRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 200
          description: What the key is for, to tell keys apart later.

    CreatedKey:
      type: object
      required: [key_id, api_key, created_at]
      properties:
        key_id:
          type: string
        api_key:
          type: string
          description: The key itself. Shown this once.
        label:
          type: string
        created_at:
          type: string
          format: date-time

    KeyView:
      type: object
      required: [key_id, created_at]
      properties:
        key_id:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: When the key last authenticated a request, to the minute.
        revoked_at:
          type: string
          format: date-time
          description: Absent while the key is valid.
